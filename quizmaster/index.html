<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>quiz finder</title>
  </head>
  <body>
    <header class="app-header">
      <h1>QuizMaster</h1>
    </header>
    <main>
      <!-- home screen-->
      <section id="home-screen" class="screen active">
        <h2>Welcome!</h2>
        <p>Test ya brian and beat yo score</p>
        <button id="start-btn">Start Quiz</button>
      </section>
      <!-- quiz zcreen-->
      <section id="quiz-screen" class="screen">
        <h2>Questoin 1 (uno)</h2>
        <p id="question-text">Your question will appear here</p>
        <div id="options">
          <button class="option-btn">A</button>
          <button class="option-btn">B</button>
          <button class="option-btn">C</button>
          <button class="option-btn">D</button>
        </div>
        <button id="finish-btn">Submit</button>
      </section>
      <!-- result scersln-->
      <section id="result-screen" class="screen">
        <h2>Quiz Complete</h2>
        <p>Your score and seven years ago: <span id="final-score">0</span></p>
        <button id="home-btn">Back to Home</button>
      </section>
      <!-- about screen -->
    </main>
    <footer>
      <p>Built by aefs</p>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
